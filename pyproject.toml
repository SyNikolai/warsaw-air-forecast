[project]
name = "airq"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SyNikolai", email = "simnikolad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[project.scripts]
airq = "airq:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
